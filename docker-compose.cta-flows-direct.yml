# cta-flows served via the HOST's Tailscale node, not its own sidecar.
#
# WHY NOT A SIDECAR. Standing up a new ts-* sidecar means registering a new
# Tailscale node, and the TS_AUTHKEY in the droplet .env is dead:
#     invalid key: API key does not exist
# Existing sidecars are unaffected -- they hold persisted state in their
# ts-<name>-state volumes and never re-register. Only a NEW node needs the key,
# and ts-cta-flows crash-looped 6 times before that was diagnosed.
#
# WHAT THIS DOES INSTEAD. The droplet host is itself a registered tailnet node
# (kx-macro), so `tailscale serve` on the host fronts the container over HTTPS
# with a real cert and no new registration:
#
#     https://kx-macro.tail284e0d.ts.net:8443
#
# The container binds loopback (for the serve proxy) AND the host tailnet IP, so
# both of these work and neither is public:
#     https://kx-macro.tail284e0d.ts.net:8443   (HTTPS, real cert)
#     http://100.78.25.100:8058                 (plain, same box)
#
# Set up once on the host (persists in tailscaled state across restarts):
#     tailscale serve --bg --https=8443 http://127.0.0.1:8058
#
# TO MOVE TO A SIDECAR later, once a fresh reusable TS_AUTHKEY is in .env:
#     tailscale serve --https=8443 off
#     docker compose up -d ts-cta-flows
#     docker compose up -d --force-recreate cta-flows   # app AFTER the sidecar
# The app must be (re)created after the sidecar is RUNNING. Creating it first
# binds a namespace the sidecar then replaces: the two land in different netns
# while docker ps still reads "Up (healthy)", because the healthcheck runs
# inside the app's own orphaned namespace. That is what happened here on the
# first deploy (4026533448 vs 4026533567).
#
# Usage:
#     docker compose -f docker-compose.yml -f docker-compose.cta-flows-direct.yml \
#         up -d cta-flows
services:
  cta-flows:
    network_mode: !reset null
    networks: [kx]
    depends_on: !reset []
    ports:
      # BOTH: loopback for `tailscale serve` to proxy, and the host's tailnet IP
      # so the plain http://100.78.25.100:8058 URL keeps working. Both are
      # tailnet-only -- neither is reachable from the public internet -- so
      # there is no exposure cost to keeping the second, and removing it broke
      # a URL that had already been handed out.
      - "127.0.0.1:8058:8058"
      - "100.78.25.100:8058:8058"
