      - ./tailscale/plumbing-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  plumbing:
    build:
      context: /opt/kx/repos/usd-funding-plumbing-cockpit
    container_name: plumbing
    restart: unless-stopped
    environment:
      PORT: "8055"
    volumes:
      - plumbing-cache:/app/data_cache
    network_mode: "service:ts-plumbing"
    depends_on:
