      CACHE_MAX_AGE_H: "6"
    volumes:
      - eur-liquidity-cache:/app/data_cache
    network_mode: "service:ts-eur-liquidity"
    depends_on:
      ts-eur-liquidity:
        condition: service_started

  # ─────────────────────────────────────────────────────────────────────────
  # Bloomberg gateway — uncomment when you have blpapi access
  # ─────────────────────────────────────────────────────────────────────────
