  # -------------------------------------------------------------------------
  # JGB Demand Monitor - sources of JGB demand by Japanese investor type.
  # Holder base, demand-shift, JSDA marginal flows, auction primary demand,
  # structural drivers. Free MOF/JSDA data; keyless; no secrets.
  # -------------------------------------------------------------------------
  ts-jgb-demand:
    image: tailscale/tailscale:latest
    container_name: ts-jgb-demand
    hostname: jgb-demand
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: jgb-demand
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ts-jgb-demand-state:/var/lib/tailscale
      - ./tailscale/jgb-demand-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  jgb-demand:
    build:
      context: /opt/kx/repos/jgb-demand
    container_name: jgb-demand
    restart: unless-stopped
    environment:
      PORT: "8064"
      JGB_CACHE_DIR: /data/cache
    volumes:
      - jgb-demand-cache:/data/cache
    network_mode: "service:ts-jgb-demand"
    depends_on:
      ts-jgb-demand:
        condition: service_started

  # -------------------------------------------------------------------------
  # ES/NQ timezone-session attribution monitor (MRP-145) - roll-cleaned
  # Asia/Europe/US session decomposition, Yahoo hourly, MONITOR_ONLY.
  # -------------------------------------------------------------------------
  ts-es-nq-sessions:
    image: tailscale/tailscale:latest
    container_name: ts-es-nq-sessions
    hostname: es-nq-sessions
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: es-nq-sessions
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ts-es-nq-sessions-state:/var/lib/tailscale
      - ./tailscale/es-nq-sessions-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  es-nq-session-monitor:
    image: kx-es-nq-session-monitor:latest
    build:
      context: /opt/kx/repos/es_nq_session_monitor
      dockerfile: Dockerfile
    container_name: es-nq-session-monitor
    restart: unless-stopped
    volumes:
      - es-nq-sessions-data:/app/data
    network_mode: "service:ts-es-nq-sessions"
    depends_on:
      ts-es-nq-sessions:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8145/health >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ─────────────────────────────────────────────────────────────────────────
  # Korea Equity Positioning & Leverage (MRP-148) — KOSPI/KOSDAQ retail
  # margin cycle off KOFIA FreeSIS + Naver. DESCRIPTIVE ONLY: the completed
  # pre-registered backtest validated 0 of 40 objects, and the page says so.
  # ─────────────────────────────────────────────────────────────────────────
  # PARKED. The shared TS_AUTHKEY in .env has EXPIRED ("invalid key: API key
  # ... not valid"), so this sidecar cannot register a new node. Existing
  # sidecars are unaffected -- they already hold node state in their volumes;
  # only NEW nodes need the key. Until a fresh key is issued, korea-leverage
  # binds to the droplet's own tailnet IP instead (see below).
  #
  # TO RESTORE the proper https://korea-leverage.<tailnet>.ts.net URL:
  #   1. new reusable, non-ephemeral, pre-approved key at
  #      https://login.tailscale.com/admin/settings/keys
  #   2. put it in /opt/kx/droplet_infra/.env as TS_AUTHKEY=...
  #   3. delete this `profiles:` line and the `ports:`/`networks:` lines on
  #      korea-leverage, restore `network_mode: "service:ts-korea-leverage"`
  #      plus its depends_on, then `docker compose up -d ts-korea-leverage
  #      korea-leverage`
  ts-korea-leverage:
    profiles: ["tailnet-node"]
    image: tailscale/tailscale:latest
    container_name: ts-korea-leverage
    hostname: korea-leverage
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: korea-leverage
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ts-korea-leverage-state:/var/lib/tailscale
      - ./tailscale/korea-leverage-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  korea-leverage:
    image: kx-korea-leverage:latest
    build:
      context: /opt/kx/repos/korea_equity_positioning
      dockerfile: Dockerfile
    container_name: korea-leverage
    restart: unless-stopped
    environment: &korea-leverage-environment
      KEPD_DATA_DIR: /data
      KEPD_EXPORT_DIR: /data/exports
      TZ: Asia/Seoul
    volumes:
      # The PIT archive is append-only and is the source of truth. The image
      # seeds it ONLY when empty, so a rebuild can never roll it back.
      - korea-leverage-data:/data
    # INTERIM (see the ts-korea-leverage note above). Bound to the droplet's
    # OWN tailnet address, so it is reachable from tailnet devices only -- the
    # public firewall allows nothing but SSH. NOT 0.0.0.0.
    ports:
      - "${KX_TAILNET_IP:-100.78.25.100}:8148:8148"
    networks: [kx]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8148/healthz >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Daily KOFIA/Naver pull. Kept on the normal bridge network deliberately:
  # it needs public egress, which the Tailscale sidecar's network namespace
  # complicates. KOFIA publishes D during D+1 (~21:45 KST); the 2h loop just
  # re-polls and no-ops when there is nothing new, since the archive dedupes.
  korea-leverage-refresh:
    image: kx-korea-leverage:latest
    container_name: korea-leverage-refresh
    restart: unless-stopped
    environment: *korea-leverage-environment
    volumes:
      - korea-leverage-data:/data
    depends_on:
      korea-leverage:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - "while true; do
           python -m kepd.ingest || echo 'refresh failed';
           python -m kepd.report || true;
           sleep 7200;
         done"
    networks: [kx]


