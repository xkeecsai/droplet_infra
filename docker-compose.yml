        condition: service_started

  # ─────────────────────────────────────────────────────────────────────────
  # G10 Central Bank Intelligence — live policy path and decision monitor
  # ─────────────────────────────────────────────────────────────────────────
  ts-g10-cb-intel:
    image: tailscale/tailscale:latest
    container_name: ts-g10-cb-intel
    hostname: g10-cb-intel
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: g10-cb-intel
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ts-g10-cb-intel-state:/var/lib/tailscale
      - ./tailscale/g10-cb-intel-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  g10-cb-intel:
    image: kx-g10-cb-intel:latest
    build:
      context: /opt/kx/repos/g10_cb_intel
      dockerfile: Dockerfile.ops
      additional_contexts:
        pricer: /opt/kx/repos/g10_ois_meeting_pricer
    container_name: g10-cb-intel
    restart: unless-stopped
    environment: &g10-cb-intel-environment
      G10_CB_INTEL_HOST: "0.0.0.0"
      G10_CB_INTEL_PORT: ${G10_CB_INTEL_PORT:-8067}
      G10_CB_INTEL_WORKERS: ${G10_CB_INTEL_WORKERS:-2}
      G10_CB_INTEL_IMPORT_DIR: /data/real_imports/latest
      G10_CB_INTEL_REFRESH_ROOT: /data/refresh
      G10_CB_INTEL_CACHE_ROOT: /data/cache
      G10_OIS_PRICER_ROOT: /app/g10_ois_meeting_pricer
      G10_OIS_PRICER_OUTPUT_DIR: /data/ois_pricer
      G10_OIS_PRICER_PYTHON: /usr/local/bin/python
      G10_CB_INTEL_DIVERGENCE_DIR: /data/divergence
      G10_CB_INTEL_SIGNAL_BUS_PATH: /data/signals/latest.jsonl
      CB_SPEECHES_STORE_DIR: /data/cb_speeches
    volumes:
      - g10-cb-intel-data:/data
      - g10-ois-pricer-cache:/app/g10_ois_meeting_pricer/data_cache
      - cb-speeches-cache:/data/cb_speeches:ro
    network_mode: "service:ts-g10-cb-intel"
    depends_on:
      ts-g10-cb-intel:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${G10_CB_INTEL_PORT}/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Invoked synchronously by refresh-g10-cb-intel.sh. It deliberately keeps a
  # normal bridge network because refreshes need foreground public-data egress.
  g10-cb-intel-refresh:
    image: kx-g10-cb-intel:latest
    profiles: ["refresh"]
    restart: "no"
    environment: *g10-cb-intel-environment
    command:
      - python
      - scripts/run_daily_refresh.py
      - --repo-root
      - /app/trading-research
      - --pricer-root
      - /app/g10_ois_meeting_pricer
    volumes:
