    network_mode: "service:ts-growth"
    depends_on:
      ts-growth:
        condition: service_started
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────
  # Inflation
  # ─────────────────────────────────────────────────────────────────────────
  ts-inflation:
    image: tailscale/tailscale:latest
    container_name: ts-inflation
    hostname: inflation
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: inflation
