# KX macro dashboards — Droplet orchestration. Tailscale-only, private-by-default.
#
# Each dashboard is paired with a Tailscale sidecar that:
#   - Joins your tailnet as a separate node (e.g. `liquidity`)
#   - Exposes the dashboard at https://<name>.<your-tailnet>.ts.net
#   - Auto-provisions a real Let's Encrypt cert (Tailscale issues these for free)
#
# No custom domain, no Cloudflare, no Caddy. Postgres stays on an internal
# Docker network and is reachable only from dashboard containers.
#
# `docker compose up -d --build` from /opt/kx/droplet_infra after bootstrap.sh.

services:

  # ─────────────────────────────────────────────────────────────────────────
  # Postgres — internal only, never exposed to tailnet
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-macro}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pg_backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kx} -d ${POSTGRES_DB:-macro}"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [kx]

  # ─────────────────────────────────────────────────────────────────────────
  # Liquidity — Tailscale sidecar + Dash app
  # ─────────────────────────────────────────────────────────────────────────
  ts-liquidity:
    image: tailscale/tailscale:latest
    container_name: ts-liquidity
    hostname: liquidity
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?must set TS_AUTHKEY in .env (reusable key)}
      TS_HOSTNAME: liquidity
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ts-liquidity-state:/var/lib/tailscale
      - ./tailscale/liquidity-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  liquidity:
    build:
      context: /opt/kx/repos/liquidity_indicators
    container_name: liquidity
    restart: unless-stopped
    environment:
      PORT: "8050"
      FRED_API_KEY: ${FRED_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-macro}
    network_mode: "service:ts-liquidity"
    depends_on:
      ts-liquidity:
        condition: service_started
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────
  # Growth
  # ─────────────────────────────────────────────────────────────────────────
  ts-growth:
    image: tailscale/tailscale:latest
    container_name: ts-growth
    hostname: growth
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: growth
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ts-growth-state:/var/lib/tailscale
      - ./tailscale/growth-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  growth:
    build:
      context: /opt/kx/repos/growth_indicators_dash
    container_name: growth
    restart: unless-stopped
    environment:
      PORT: "8051"
      FRED_API_KEY: ${FRED_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-macro}
    network_mode: "service:ts-growth"
    depends_on:
      ts-growth:
        condition: service_started
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────
  # Inflation
  # ─────────────────────────────────────────────────────────────────────────
  ts-inflation:
    image: tailscale/tailscale:latest
    container_name: ts-inflation
    hostname: inflation
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: inflation
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ts-inflation-state:/var/lib/tailscale
      - ./tailscale/inflation-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  inflation:
    build:
      context: /opt/kx/repos/inflation_indicators
    container_name: inflation
    restart: unless-stopped
    environment:
      PORT: "8052"
      FRED_API_KEY: ${FRED_API_KEY:-}
      TRUFLATION_API_KEY: ${TRUFLATION_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-macro}
    network_mode: "service:ts-inflation"
    depends_on:
      ts-inflation:
        condition: service_started
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────
  # Seasonality (Streamlit)
  # ─────────────────────────────────────────────────────────────────────────
  ts-seasonality:
    image: tailscale/tailscale:latest
    container_name: ts-seasonality
    hostname: seasonality
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: seasonality
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ts-seasonality-state:/var/lib/tailscale
      - ./tailscale/seasonality-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  seasonality:
    build:
      context: /opt/kx/repos/seasonality
    container_name: seasonality
    restart: unless-stopped
    environment:
      PORT: "8501"
    network_mode: "service:ts-seasonality"
    depends_on:
      ts-seasonality:
        condition: service_started

  # ─────────────────────────────────────────────────────────────────────────
  # Polymarket smart-money mirror — dashboard + scheduler
  # Dashboard on port 8053; scheduler runs as a background container with
  # no public exposure (internal kx network only, reaches postgres).
  # ─────────────────────────────────────────────────────────────────────────
  ts-polymarket:
    image: tailscale/tailscale:latest
    container_name: ts-polymarket
    hostname: polymarket
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: polymarket
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ts-polymarket-state:/var/lib/tailscale
      - ./tailscale/polymarket-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  # One-shot migration gate (DEF-3). Creates polymarket_sm if missing and runs
  # `alembic upgrade head`, then exits 0. Both the dashboard and scheduler wait
  # for this to COMPLETE SUCCESSFULLY before starting, so they never race on the
  # schema and never run alembic concurrently.
  polymarket-migrate:
    build:
      context: /opt/kx/repos/polymarket_analysis
    container_name: polymarket-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kx}:${POSTGRES_PASSWORD}@postgres:5432/polymarket_sm
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["migrate"]
    networks: [kx]
    depends_on:
      postgres:
        condition: service_healthy

  polymarket-dashboard:
    build:
      context: /opt/kx/repos/polymarket_analysis
    container_name: polymarket-dashboard
    restart: unless-stopped
    environment:
      PORT: "8053"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kx}:${POSTGRES_PASSWORD}@postgres:5432/polymarket_sm
      # Migrations are owned by polymarket-migrate; skip them here to avoid a race.
      SKIP_MIGRATIONS: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-claude-haiku-4-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["dashboard"]
    network_mode: "service:ts-polymarket"
    depends_on:
      ts-polymarket:
        condition: service_started
      postgres:
        condition: service_healthy
      polymarket-migrate:
        condition: service_completed_successfully

  polymarket-scheduler:
    build:
      context: /opt/kx/repos/polymarket_analysis
    container_name: polymarket-scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kx}:${POSTGRES_PASSWORD}@postgres:5432/polymarket_sm
      SKIP_MIGRATIONS: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-claude-haiku-4-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMART_MONEY_MIN_CLOSED_MARKETS: ${SMART_MONEY_MIN_CLOSED_MARKETS:-10}
      WATCHLIST_TOP_N_PER_CLUSTER: ${WATCHLIST_TOP_N_PER_CLUSTER:-20}
      WATCHLIST_LOOKBACK_DAYS: ${WATCHLIST_LOOKBACK_DAYS:-90}
      SNAPSHOT_PRIOR_LOOKBACK_DAYS: ${SNAPSHOT_PRIOR_LOOKBACK_DAYS:-30}
      ALERT_SIZE_THRESHOLD_USD: ${ALERT_SIZE_THRESHOLD_USD:-10000}
      ALERT_CLUSTER_M: ${ALERT_CLUSTER_M:-3}
      ALERT_CLUSTER_WINDOW_HOURS: ${ALERT_CLUSTER_WINDOW_HOURS:-24}
      WATCHLIST_POLL_INTERVAL_MIN: ${WATCHLIST_POLL_INTERVAL_MIN:-10}
      DAILY_BATCH_HOUR_UTC: ${DAILY_BATCH_HOUR_UTC:-6}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["scheduler"]
    networks: [kx]
    depends_on:
      postgres:
        condition: service_healthy
      polymarket-migrate:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────────────────────────────
  # MacroDash — Plotly Dash replica of macroodash.vercel.app
  # ─────────────────────────────────────────────────────────────────────────
  ts-macrodash:
    image: tailscale/tailscale:latest
    container_name: ts-macrodash
    hostname: macrodash
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: macrodash
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ts-macrodash-state:/var/lib/tailscale
      - ./tailscale/macrodash-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  macrodash:
    build:
      context: /opt/kx/repos/macrodash
    container_name: macrodash
    restart: unless-stopped
    environment:
      PORT: "8054"
      DATABASE_URL: postgresql://${POSTGRES_USER:-kx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-macro}
    network_mode: "service:ts-macrodash"
    depends_on:
      ts-macrodash:
        condition: service_started
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────
  # Momentum screener (Streamlit) — cross-asset momentum; roll-adjusted
  # continuous futures via Databento (falls back to yfinance if the key is unset)
  # ─────────────────────────────────────────────────────────────────────────
  ts-momentum:
    image: tailscale/tailscale:latest
    container_name: ts-momentum
    hostname: momentum
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: momentum
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ts-momentum-state:/var/lib/tailscale
      - ./tailscale/momentum-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [kx]

  momentum:
    build:
      context: /opt/kx/repos/momentum_screener_assets
    container_name: momentum
    restart: unless-stopped
    environment:
      DATABENTO_API_KEY: ${DATABENTO_API_KEY:-}
    network_mode: "service:ts-momentum"
    depends_on:
      ts-momentum:
        condition: service_started

  # ─────────────────────────────────────────────────────────────────────────
  # Bloomberg gateway — uncomment when you have blpapi access
  # ─────────────────────────────────────────────────────────────────────────
