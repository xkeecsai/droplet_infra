  #   environment:
  #     TS_AUTHKEY: ${TS_AUTHKEY:?}
  #     TS_HOSTNAME: bbg
  #     TS_STATE_DIR: /var/lib/tailscale
  #     TS_SERVE_CONFIG: /config/serve.json
  #     TS_USERSPACE: "false"
  #   volumes:
  #     - ts-bbg-state:/var/lib/tailscale
  #     - ./tailscale/bbg-serve.json:/config/serve.json:ro
  #     - /dev/net/tun:/dev/net/tun
  #   cap_add: [NET_ADMIN, NET_RAW]
  #   networks: [kx]
  #
  # bbg-gateway:
  #   build:
  #     context: https://github.com/xkeecsai/bbg_gateway.git#main
  #   container_name: bbg-gateway
  #   restart: unless-stopped
  #   environment:
  #     PORT: "8053"
  #     BLOOMBERG_HOST: ${BLOOMBERG_HOST:-}
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-kx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-macro}
  #   network_mode: "service:ts-bbg"
  #   depends_on:
  #     ts-bbg: { condition: service_started }
  #     postgres: { condition: service_healthy }

volumes:
  pg_data:
  ts-liquidity-state:
  ts-growth-state:
  ts-inflation-state:
  ts-seasonality-state:
  ts-polymarket-state:
  ts-macrodash-state:
  ts-momentum-state:
  # ts-bbg-state:

networks:
  kx:
    driver: bridge
